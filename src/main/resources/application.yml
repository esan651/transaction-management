spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:h2:mem:maybankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: maybank-case-study-secret-key-2026-must-be-at-least-256-bits-long-for-security
  expiration: 86400000

# CORS Configuration (externalized from code)
app:
  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Requested-With
    allow-credentials: true

# SpringDoc / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
  show-actuator: false

logging:
  level:
    org.springframework.batch: DEBUG
    com.maybank.transaction: DEBUG
